# Daily GA4 + GSC sync via the app's own native "Connect with Google" OAuth
# token - same lib/google/auth.ts resolver every live GA4/GSC read in the
# app uses, no third-party broker.
#
# Runs from GitHub-hosted runner so we don't depend on anyone's laptop
# being on. ~30 sec per run, well inside the free 2000 min/month quota.
#
# To trigger manually: Actions tab -> Sync URL Metrics -> Run workflow.
# Secrets required in repo Settings -> Secrets and variables -> Actions:
#   - NEXT_PUBLIC_SUPABASE_URL
#   - SUPABASE_SERVICE_ROLE_KEY
#   - GOOGLE_OAUTH_CLIENT_ID
#   - GOOGLE_OAUTH_CLIENT_SECRET
#   - OAUTH_TOKEN_ENCRYPTION_KEY
# (same three OAuth values already set in Vercel - the refresh token itself
# lives encrypted in Supabase, not in a secret here.)

name: Sync URL Metrics

on:
  schedule:
    # 8:00 AM Asia/Kolkata = 02:30 UTC, Monday through Friday.
    # Runs before the work day so the Blog Audit + Reports pages have
    # fresh GSC + GA4 data when the team logs in.
    # Cron format: minute hour day-of-month month day-of-week
    - cron: "30 2 * * 1-5"

  # Lets us trigger manually from the Actions tab for debugging or backfill.
  workflow_dispatch:

jobs:
  sync:
    name: Pull GSC + GA4 metrics
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run sync script
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          OAUTH_TOKEN_ENCRYPTION_KEY: ${{ secrets.OAUTH_TOKEN_ENCRYPTION_KEY }}
        run: npx tsx scripts/sync-url-metrics.ts
